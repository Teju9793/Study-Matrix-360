<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>404 — Study Matrix</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap');
:root{--status-bar-height:max(24px, env(safe-area-inset-top));--bg:#030d12;--t1:#00e5c0;--t2:#00b89c;--t3:#00ffd5;--muted:#4a7a72;--text:#d0fff5;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 90% 50% at 50% -5%,rgba(0,200,160,0.13) 0%,transparent 60%),radial-gradient(ellipse 60% 60% at 100% 40%,rgba(0,160,130,0.08) 0%,transparent 55%),radial-gradient(ellipse 50% 50% at 0% 70%,rgba(0,180,150,0.07) 0%,transparent 55%);animation:oceanBreath 10s ease-in-out infinite alternate;}
@keyframes oceanBreath{0%{opacity:.7;transform:scaleY(1)}100%{opacity:1;transform:scaleY(1.04)}}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 15% 25%,rgba(0,229,192,.7),transparent),radial-gradient(1px 1px at 75% 12%,rgba(0,200,160,.5),transparent),radial-gradient(2px 2px at 45% 65%,rgba(0,255,213,.4),transparent),radial-gradient(1px 1px at 88% 72%,rgba(0,180,145,.5),transparent);animation:drift 18s ease-in-out infinite alternate;}
@keyframes drift{0%{transform:translateY(0) translateX(0)}100%{transform:translateY(-20px) translateX(6px)}}
.center{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;padding-top:max(20px, env(safe-area-inset-top));text-align:center;}
.icon-box{width:100px;height:100px;border-radius:28px;background:linear-gradient(145deg,rgba(0,80,65,.5),rgba(0,40,35,.7));border:1.5px solid rgba(0,229,192,.25);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:24px;box-shadow:0 0 40px rgba(0,200,160,.2);animation:floatIcon 4s ease-in-out infinite;}
@keyframes floatIcon{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.code{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--muted);margin-bottom:8px;}
.headline{font-size:26px;font-weight:800;margin-bottom:10px;background:linear-gradient(90deg,var(--t1),var(--t3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-size:14px;color:var(--muted);line-height:1.6;max-width:280px;margin-bottom:28px;}
.home-btn{padding:12px 28px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--t1),var(--t3));color:#032b2e;font-weight:700;font-size:14px;cursor:pointer;font-family:'Sora',sans-serif;box-shadow:0 6px 20px rgba(0,229,192,.3);transition:all .25s;}
.home-btn:hover{transform:scale(1.06);box-shadow:0 8px 28px rgba(0,229,192,.45);}
footer{position:absolute;bottom:20px;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="center">
  <div class="icon-box">🚧</div>
  <div class="code">COMING SOON</div>
  <div class="headline">Feature Not Ready Yet</div>
  <div class="sub">We are working on it and it will be added soon. Stay tuned!</div>
  <button class="home-btn" onclick="window.history.back()">← Back to Home</button>
  <footer>© 2026 Study Matrix</footer>
</div>
<script>
(function(){function setBar(px){if(px>0&&px<120)document.documentElement.style.setProperty('--status-bar-height',px+'px');}function detect(){if(window.screenTop>0&&window.screenTop<120){setBar(window.screenTop);return;}if(window.screenY>0&&window.screenY<120){setBar(window.screenY);return;}var d=window.screen.height-window.outerHeight;if(d>0&&d<80)setBar(d);}detect();window.addEventListener('load',detect);window.addEventListener('resize',detect);setTimeout(detect,500);})();
</script>
<script>
(function() {
  history.pushState({ sm: true }, '');
  window.addEventListener('popstate', function() { window.history.back(); });
})();
</script>
</body>
</html>
