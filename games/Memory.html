<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Memory Match — Study Matrix</title>
<meta name="theme-color" content="#041623"/>
<style>
:root{--status-bar-height:max(24px, env(safe-area-inset-top));--bg-1:#020615;--panel:#071822;--neon-blue:#06e6ff;--neon-green:#2cff7a;--glass:rgba(255,255,255,0.03);--muted:rgba(190,234,243,0.6);--card-radius:12px;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 0%,#041423 0%,#020a18 70%,#000610 100%) !important;font-family:Inter,system-ui,Segoe UI,Roboto,-apple-system;color:#e6fbff;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:14px;min-height:100vh;}
.app{width:100%;max-width:980px;min-height:100vh;background:linear-gradient(180deg,rgba(0,30,60,0.55),rgba(0,20,40,0.50),rgba(0,10,25,0.45)) !important;border-radius:18px;padding:12px;box-shadow:0 25px 60px rgba(0,0,0,0.65),0 0 40px rgba(6,230,255,0.12);position:relative;overflow:hidden;}
.uni-back-wrap{position:fixed !important;top:calc(8px + max(24px, env(safe-area-inset-top))) !important;right:16px !important;z-index:99999 !important;}
button[onclick='window.history.back()']{appearance:none;-webkit-appearance:none;border:0;padding:10px 16px;border-radius:28px;font-weight:800;font-size:16px;background:linear-gradient(180deg,rgba(6,230,255,0.03),rgba(44,255,122,0.02));color:var(--neon-blue);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(6,230,255,0.12),0 6px 24px rgba(2,6,23,0.6);border:2px solid rgba(6,230,255,0.18);position:relative;}
button[onclick='window.history.back()']:hover{transform:translateY(-3px);color:#fff;}
.top-title{text-align:center;margin-top:calc(18px + max(24px, env(safe-area-inset-top)));}
.top-title h1{font-size:18px;color:var(--neon-blue);font-weight:900;letter-spacing:0.6px;margin-bottom:2px}
.top-title .subtitle{display:block;font-size:12px;color:var(--muted);font-weight:700;}
.page{display:none;padding:18px;height:calc(100vh - 96px);overflow:auto}
.page.active{display:block}
.entry{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;height:100%;}
.gameTitle{font-size:34px;font-weight:900;color:var(--neon-blue);text-shadow:0 0 20px rgba(6,230,255,0.4),0 0 40px rgba(6,230,255,0.2);}
.startGlowing{padding:14px 38px;border-radius:50px;border:none;font-size:20px;font-weight:800;cursor:pointer;color:#001217;background:linear-gradient(90deg,var(--neon-blue),var(--neon-green));box-shadow:0 8px 30px rgba(6,230,255,0.35),0 0 40px rgba(44,255,122,0.25);transition:transform 160ms ease,box-shadow 160ms;}
.startGlowing:hover{transform:scale(1.04);}
.diffTopBar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;margin-top:6px;}
.diffTitle{font-size:22px;font-weight:900;color:var(--neon-blue);text-shadow:0 0 20px rgba(6,230,255,0.4);}
.uniBackSmall{padding:8px 18px;border-radius:26px;border:2px solid rgba(6,230,255,0.35);background:transparent;color:var(--neon-blue);font-weight:700;cursor:pointer;box-shadow:0 0 15px rgba(6,230,255,0.3);}
.diffCard{background:transparent !important;border:none !important;box-shadow:none !important;padding:10px 0 !important;}
.chooseTitle{font-size:20px;font-weight:900;color:var(--neon-blue);margin-bottom:4px;text-align:center !important;}
.diffBtns{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
.diffSelect{all:unset;display:block;width:70%;margin:14px auto;padding:18px 0;background:linear-gradient(90deg,#00eaff,#00ff88);border-radius:26px;text-align:center;font-size:20px;font-weight:900;color:#001217;cursor:pointer;box-shadow:0 0 25px rgba(0,255,200,0.32),0 0 40px rgba(0,255,200,0.18);transition:0.18s ease;}
.diffSelect:hover,.diffSelect.active{transform:scale(1.05);}
.board-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:6px;background:radial-gradient(circle at 50% 40%,rgba(6,230,255,0.35),rgba(6,230,255,0.12),rgba(4,22,35,0.55));padding:26px 12px;border-radius:22px;box-shadow:0 0 90px rgba(6,230,255,0.35),0 0 140px rgba(6,230,255,0.22);}
.board{display:grid;gap:12px;justify-items:center;padding-bottom:30px;width:100%;max-width:980px;}
.grid-3{grid-template-columns:repeat(3,1fr);}.grid-4{grid-template-columns:repeat(4,1fr);}.grid-6{grid-template-columns:repeat(6,1fr);}
.card{width:100%;max-width:96px;aspect-ratio:3/4;border-radius:var(--card-radius);cursor:pointer;perspective:1000px;}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 420ms cubic-bezier(.2,.9,.4,1);border-radius:inherit;}
.card.flipped .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;border-radius:inherit;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;backface-visibility:hidden;box-shadow:0 12px 30px rgba(2,6,23,0.6);}
.face.back{background:rgba(255,255,255,0.10);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.18);color:var(--neon-blue);transform:rotateY(0deg);font-size:20px;}
.face.front{background:rgba(0,255,220,0.15);backdrop-filter:blur(6px);border:1px solid rgba(0,255,220,0.25);color:var(--neon-green);transform:rotateY(180deg);}
.card.matched .card-inner{box-shadow:0 20px 60px rgba(44,255,122,0.06);outline:3px solid rgba(44,255,122,0.06);}
.controls{display:flex;gap:10px;align-items:center;}
.stat{background:linear-gradient(180deg,rgba(255,255,255,0.012),rgba(255,255,255,0.01));padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.02);font-weight:800;color:var(--neon-blue);}
.icon-btn{background:transparent;border:0;color:var(--neon-blue);font-weight:900;font-size:18px;padding:8px;cursor:pointer;}
.app[data-page="entry"] .controls,.app[data-page="diff"] .controls{display:none;}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,0.6),rgba(0,0,0,0.6));z-index:120;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity 220ms ease;}
.overlay.visible{opacity:1;pointer-events:auto;}
.dialog{background:linear-gradient(180deg,#042a2b,#021617);padding:18px;border-radius:12px;border:1px solid rgba(6,230,255,0.06);min-width:260px;text-align:center;}
.dialog h3{color:var(--neon-blue);font-size:22px;margin-bottom:6px}
.dialog p{color:#c7f5f9;margin-bottom:6px}
.dialog .row{display:flex;gap:8px;justify-content:center;margin-top:8px}
.app[data-page="entry"] .top-title,.app[data-page="entry"] .controls,.app[data-page="entry"] .uni-back-wrap{display:none !important;}
.app[data-page="diff"] .top-title,.app[data-page="diff"] .controls,.app[data-page="diff"] .uni-back-wrap{display:none !important;}
.app[data-page="game"] .diffTopBar{display:none !important;}
.app[data-page="game"] .top-title,.app[data-page="game"] .uni-back-wrap{display:none !important;}
.app[data-page="game"] .controls{margin-top:calc(70px + max(24px, env(safe-area-inset-top))) !important;}
.gameBack{position:absolute;top:calc(15px + max(0px, env(safe-area-inset-top)));right:15px;z-index:200;}
.logoBox{width:140px;height:140px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(6,230,255,0.03),rgba(44,255,122,0.02));border:3px solid rgba(6,230,255,0.12);box-shadow:0 20px 60px rgba(6,230,255,0.03);}
.logoBox img{width:70%;height:70%;object-fit:contain;}
.win-celebrate{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.particle{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#00eaff,#00ff88);animation:floatUp 2.4s linear infinite;opacity:0.8;}
@keyframes floatUp{0%{transform:translateY(40px) scale(1);opacity:0.8;}100%{transform:translateY(-200px) scale(0.4);opacity:0;}}
@media(max-width:420px){.app{border-radius:0;padding:10px}.page{height:calc(100vh - 72px);padding:10px}.card{max-width:72px}.face{font-size:24px}}
</style>
</head>
<body>
<div class="app" id="app" data-page="entry">
  <div class="uni-back-wrap"><button onclick='window.history.back()'>← Back</button></div>
  <div class="top-title"><h1>Memory Match</h1><span class="subtitle">Neon • Premium</span></div>
  <div class="controls" style="display:flex;justify-content:center;margin-top:10px;">
    <div class="stat" id="movesStat">Moves: 0</div>
    <div class="stat" id="timeStat">Time: 00:00</div>
    <button class="icon-btn" id="restartBtn">Restart</button>
  </div>
  <section id="entryPage" class="page active">
    <div class="entry">
      <div class="logoBox"><img src="../../icons/memory.png" alt="Game Logo"></div>
      <div class="gameTitle">Memory Match</div>
      <button class="startGlowing" id="startMainBtn">Start</button>
    </div>
  </section>
  <section id="diffPage" class="page">
    <div class="diffTopBar">
      <h2 class="diffTitle">Memory Match</h2>
      <button onclick='window.history.back()' class="uniBackSmall">← Back</button>
    </div>
    <div class="diffCard">
      <h3 class="chooseTitle">Choose Difficulty</h3>
      <div class="diffBtns">
        <button class="diffSelect" data-diff="easy">Easy<br><span>3 × 4</span></button>
        <button class="diffSelect" data-diff="medium">Medium<br><span>4 × 4</span></button>
        <button class="diffSelect" data-diff="hard">Hard<br><span>6 × 4</span></button>
      </div>
    </div>
  </section>
  <section id="gamePage" class="page">
    <div class="gameBack"><button class="uniBackSmall" onclick="window.history.back()">← Back</button></div>
    <div class="board-wrap"><div id="board" class="board grid-4"></div></div>
  </section>
  <div id="winOverlay" class="overlay">
    <div class="win-celebrate" id="celeParticles"></div>
    <div class="dialog">
      <p style="color:#00ffbf;font-weight:900;font-size:16px;margin-bottom:10px;">✨ Amazing! You are getting smarter! ✨</p>
      <h3>You Win 🎉</h3>
      <p id="winInfo">Moves • Time</p>
      <div class="row">
        <button class="startGlowing" id="againBtn">Play Again</button>
        <button class="diff-btn" id="homeBtn">Home</button>
      </div>
    </div>
  </div>
</div>
<script>
(()=>{
  const EMOJIS=["🌸","🔥","🍀","🌟","🚀","🎵","🐱","🐶","🍎","🍕","⚽","🎲","🌙","☀️","🥑","🍩","📚","🔔","🧩","🎯","🍓","🍫","🦊","🦄"];
  const DIFF={easy:{cols:3,rows:4,pairs:6},medium:{cols:4,rows:4,pairs:8},hard:{cols:6,rows:4,pairs:12}};
  const LS_KEY='study_matrix_memory_best_v2';
  const app=document.getElementById('app'),entryPage=document.getElementById('entryPage'),diffPage=document.getElementById('diffPage'),gamePage=document.getElementById('gamePage');
  const startMainBtn=document.getElementById('startMainBtn'),diffBtns=Array.from(document.querySelectorAll('.diffSelect'));
  const boardEl=document.getElementById('board'),movesStat=document.getElementById('movesStat'),timeStat=document.getElementById('timeStat'),restartBtn=document.getElementById('restartBtn');
  const winOverlay=document.getElementById('winOverlay'),winInfo=document.getElementById('winInfo'),againBtn=document.getElementById('againBtn'),homeBtn=document.getElementById('homeBtn');
  let selectedDiff='easy',deck=[],flipped=[],matched=new Set(),moves=0,timer=null,elapsed=0,startTs=null,clickingLocked=false;
  function setAppPage(p){app.setAttribute('data-page',p);if(p==='entry')show(entryPage);if(p==='diff')show(diffPage);if(p==='game')show(gamePage);}
  function show(el){[entryPage,diffPage,gamePage].forEach(x=>x.classList.remove('active'));el.classList.add('active');setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),30);}
  function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  function loadBest(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch(e){return{};}}
  function saveBest(o){try{localStorage.setItem(LS_KEY,JSON.stringify(o));}catch(e){}}
  diffBtns.forEach(b=>b.addEventListener('click',()=>{diffBtns.forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedDiff=b.getAttribute('data-diff');buildAndStart(selectedDiff);}));
  function buildDeck(pairs){const arr=[],chosen=EMOJIS.slice(0,pairs);chosen.forEach((v,i)=>{arr.push({id:i*2,val:v});arr.push({id:i*2+1,val:v});});for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
  function renderBoard(){boardEl.innerHTML='';const cfg=DIFF[selectedDiff];boardEl.className='board';if(cfg.cols===3)boardEl.classList.add('grid-3');if(cfg.cols===4)boardEl.classList.add('grid-4');if(cfg.cols===6)boardEl.classList.add('grid-6');deck.forEach((card,idx)=>{const c=document.createElement('div');c.className='card';c.dataset.index=idx;c.tabIndex=0;const inner=document.createElement('div');inner.className='card-inner';const front=document.createElement('div');front.className='face front';front.textContent=card.val;const back=document.createElement('div');back.className='face back';back.innerHTML='❓';inner.appendChild(front);inner.appendChild(back);c.appendChild(inner);c.addEventListener('click',onCardClick);boardEl.appendChild(c);});}
  function startTimer(){if(timer)return;startTs=Date.now()-elapsed*1000;timer=setInterval(()=>{elapsed=Math.floor((Date.now()-startTs)/1000);timeStat.textContent='Time: '+formatTime(elapsed);},500);}
  function stopTimer(){if(timer)clearInterval(timer);timer=null;}
  function resetTimer(){stopTimer();elapsed=0;timeStat.textContent='Time: 00:00';startTs=null;}
  function onCardClick(e){if(clickingLocked)return;const elCard=e.currentTarget,idx=Number(elCard.dataset.index);if(matched.has(idx)||flipped.includes(idx))return;if(moves===0&&flipped.length===0&&matched.size===0&&!timer)startTimer();elCard.classList.add('flipped');flipped.push(idx);if(flipped.length===1)return;moves++;movesStat.textContent='Moves: '+moves;const a=deck[flipped[0]].val,b=deck[flipped[1]].val;if(a===b){clickingLocked=true;setTimeout(()=>{const elA=boardEl.querySelector(`[data-index="${flipped[0]}"]`),elB=boardEl.querySelector(`[data-index="${flipped[1]}"]`);if(elA)elA.classList.add('matched');if(elB)elB.classList.add('matched');matched.add(flipped[0]);matched.add(flipped[1]);flipped=[];clickingLocked=false;checkWin();},700);}else{clickingLocked=true;setTimeout(()=>{const elA=boardEl.querySelector(`[data-index="${flipped[0]}"]`),elB=boardEl.querySelector(`[data-index="${flipped[1]}"]`);if(elA)elA.classList.remove('flipped');if(elB)elB.classList.remove('flipped');flipped=[];clickingLocked=false;},1200);}}
  function checkWin(){if(matched.size===deck.length){stopTimer();const result={moves,time:elapsed},bestAll=loadBest(),prev=bestAll[selectedDiff]||null;let isBest=!prev||(result.time<prev.time)||(result.time===prev.time&&result.moves<prev.moves);if(isBest){bestAll[selectedDiff]=result;saveBest(bestAll);}const bestNow=loadBest()[selectedDiff];winInfo.textContent=`Moves: ${moves} • Time: ${formatTime(elapsed)}${bestNow?' • Best: '+bestNow.moves+' / '+formatTime(bestNow.time):''}`;showWin();}}
  function showWin(){winOverlay.classList.add('visible');spawnParticles();againBtn.focus();}
  function hideWin(){winOverlay.classList.remove('visible');}
  function buildAndStart(diffKey){selectedDiff=diffKey||selectedDiff;deck=buildDeck(DIFF[selectedDiff].pairs);flipped=[];matched=new Set();moves=0;movesStat.textContent='Moves: 0';resetTimer();renderBoard();setAppPage('game');}
  startMainBtn.addEventListener('click',()=>setAppPage('diff'));
  restartBtn.addEventListener('click',()=>buildAndStart(selectedDiff));
  againBtn.addEventListener('click',()=>{hideWin();buildAndStart(selectedDiff);});
  homeBtn.addEventListener('click',()=>{hideWin();setAppPage('entry');});
  function spawnParticles(){const wrap=document.getElementById("celeParticles");wrap.innerHTML="";for(let i=0;i<26;i++){const p=document.createElement("div");p.className="particle";p.style.left=Math.random()*100+"%";p.style.bottom="-20px";p.style.animationDelay=(Math.random()*1.4)+"s";wrap.appendChild(p);}}
  (function init(){movesStat.textContent='Moves: 0';timeStat.textContent='Time: 00:00';setAppPage('entry');})();
})();
</script>
<audio id="flipSound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<script>(function(){function setBar(px){if(px>0&&px<120)document.documentElement.style.setProperty("--status-bar-height",px+"px");}function detect(){if(window.screenTop>0&&window.screenTop<120){setBar(window.screenTop);return;}if(window.screenY>0&&window.screenY<120){setBar(window.screenY);return;}var d=window.screen.height-window.outerHeight;if(d>0&&d<80)setBar(d);}detect();window.addEventListener("load",detect);window.addEventListener("resize",detect);setTimeout(detect,500);setTimeout(detect,1500);})();</script>
</body></html>
