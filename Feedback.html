<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Feedback — Study Matrix</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap');
:root{--status-bar-height:max(24px, env(safe-area-inset-top));--bg:#030d12;--card:#0a2030;--border:rgba(0,200,160,0.1);--t1:#00e5c0;--t2:#00b89c;--t3:#00ffd5;--muted:#4a7a72;--text:#d0fff5;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 90% 50% at 50% -5%,rgba(0,200,160,0.13) 0%,transparent 60%),radial-gradient(ellipse 60% 60% at 100% 40%,rgba(0,160,130,0.08) 0%,transparent 55%),radial-gradient(ellipse 50% 50% at 0% 70%,rgba(0,180,150,0.07) 0%,transparent 55%);animation:oceanBreath 10s ease-in-out infinite alternate;}
@keyframes oceanBreath{0%{opacity:.7;transform:scaleY(1)}100%{opacity:1;transform:scaleY(1.04)}}
.topbar{position:fixed;top:0;left:0;right:0;height:calc(62px + var(--status-bar-height));padding-top:var(--status-bar-height);padding-left:18px;padding-right:18px;display:flex;align-items:center;justify-content:space-between;background:rgba(3,13,18,0.92);backdrop-filter:blur(28px) saturate(200%);-webkit-backdrop-filter:blur(28px);border-bottom:1px solid rgba(0,200,160,0.08);z-index:9999;}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--t1),var(--t3),var(--t2),transparent);background-size:200% 100%;animation:waveFlow 4s linear infinite;box-shadow:0 0 8px rgba(0,229,192,0.3);}
@keyframes waveFlow{0%{background-position:0% 0%}100%{background-position:200% 0%}}
.tb-title{font-size:20px;font-weight:800;letter-spacing:-0.3px;background:linear-gradient(90deg,var(--t1),var(--t3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.tb-back{padding:7px 16px;font-size:13px;font-weight:600;background:rgba(0,80,65,0.25);border:1px solid rgba(0,200,160,0.2);color:var(--t1);border-radius:12px;cursor:pointer;transition:all .2s;font-family:'Sora',sans-serif;}
.tb-back:hover{background:rgba(0,100,80,0.35);border-color:var(--t1);box-shadow:0 0 14px rgba(0,229,192,0.18);}
.main{position:relative;z-index:1;padding-top:calc(72px + var(--status-bar-height));padding-bottom:40px;}
.container{width:100%;max-width:520px;margin:0 auto;padding:20px 16px;}
.page-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:20px;background:linear-gradient(90deg,var(--t1),var(--t3),var(--t2));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite;filter:drop-shadow(0 0 12px rgba(0,200,160,0.3));}
@keyframes shimmer{to{background-position:200% center}}
.card{background:linear-gradient(145deg,rgba(10,32,48,0.9),rgba(7,24,36,0.95));border:1px solid rgba(0,200,160,0.12);border-radius:20px;padding:24px 20px;box-shadow:0 10px 40px rgba(0,0,0,0.6);backdrop-filter:blur(18px);}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;margin-top:16px;}
label:first-child{margin-top:0;}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(0,200,160,0.15);background:rgba(0,255,213,0.04);color:var(--text);font-family:'Sora',sans-serif;font-size:14px;transition:border .2s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--t1);box-shadow:0 0 10px rgba(0,229,192,0.2);}
select option{background:var(--bg);}
.starBox{display:flex;justify-content:center;gap:10px;margin:16px 0;}
.star{font-size:32px;cursor:pointer;color:rgba(0,200,160,0.15);transition:all .2s;}
.star.active{color:var(--t1);text-shadow:0 0 12px var(--t1);}
.submitBtn{width:100%;padding:13px;border:none;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;margin-top:20px;background:linear-gradient(135deg,var(--t1),var(--t3));color:#032b2e;font-family:'Sora',sans-serif;box-shadow:0 6px 20px rgba(0,229,192,0.3);transition:all .25s;}
.submitBtn:hover{transform:scale(1.04);box-shadow:0 8px 28px rgba(0,229,192,0.45);}
.successMsg{text-align:center;margin-top:16px;display:none;color:var(--t1);font-size:14px;font-weight:600;padding:12px;border-radius:12px;background:rgba(0,229,192,0.08);border:1px solid rgba(0,229,192,0.2);}
</style>
</head>
<body>
<div class="topbar"><div class="tb-title">Feedback</div><button class="tb-back" onclick="window.history.back()">‹ Back</button></div>
<div class="main"><div class="container">
  <div class="page-title">Share Your Feedback</div>
  <div class="card">
    <label>Your Name (optional)</label><input type="text" id="name" placeholder="Enter your name">
    <label>Your Year / Sem</label>
    <select id="year"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select>
    <label>Your Feedback</label><textarea id="feedback" rows="4" placeholder="Write your feedback here..."></textarea>
    <label>Rate Us</label>
    <div class="starBox">
      <span class="star" onclick="setRate(1)">★</span><span class="star" onclick="setRate(2)">★</span><span class="star" onclick="setRate(3)">★</span><span class="star" onclick="setRate(4)">★</span><span class="star" onclick="setRate(5)">★</span>
    </div>
    <button class="submitBtn" onclick="sendFeedback()">Submit Feedback</button>
    <div class="successMsg" id="successMsg">✔ Thank you! Your feedback has been submitted.</div>
  </div>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyAVaZGKpIEJzdvrsaTJ9A6ebrArpoGxaYQ",authDomain:"studymatrixfeedback.firebaseapp.com",databaseURL:"https://studymatrixfeedback-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"studymatrixfeedback",storageBucket:"studymatrixfeedback.firebasestorage.app",messagingSenderId:"776592151524",appId:"1:776592151524:web:60fb875f90f9ead7486df1"});
const db=getDatabase(app);let rating=0;
window.setRate=function(n){rating=n;document.querySelectorAll(".star").forEach((s,i)=>s.classList.toggle("active",i<n));};
window.sendFeedback=function(){
  const name=document.getElementById("name").value,year=document.getElementById("year").value,feedback=document.getElementById("feedback").value;
  if(!feedback.trim()){alert("Please enter feedback.");return;}
  const nr=push(ref(db,"feedbacks/"));
  set(nr,{name,year,rating,feedback,time:Date.now()}).then(()=>{document.getElementById("successMsg").style.display="block";document.getElementById("feedback").value="";rating=0;document.querySelectorAll(".star").forEach(s=>s.classList.remove("active"));}).catch(e=>alert("Error: "+e.message));
};
</script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){emailjs.init("7rAEi2x4COfcnUDy4");})();
function sendEmailFeedback(order,name,year,feedback,star){emailjs.send("service_k22rupc","template_is9ijzg",{order,name,year,feedback,star,datetime:new Date().toLocaleString()}).then(r=>console.log("✔",r.status)).catch(e=>console.log("❌",e));}
(function(){function setBar(px){if(px>0&&px<120)document.documentElement.style.setProperty('--status-bar-height',px+'px');}function detect(){if(window.screenTop>0&&window.screenTop<120){setBar(window.screenTop);return;}if(window.screenY>0&&window.screenY<120){setBar(window.screenY);return;}var d=window.screen.height-window.outerHeight;if(d>0&&d<80)setBar(d);}detect();window.addEventListener('load',detect);window.addEventListener('resize',detect);setTimeout(detect,500);setTimeout(detect,1500);})();
</script>
<script>(function(){history.pushState({sm:true},'');window.addEventListener('popstate',function(){window.history.back();});})();</script>
</body></html>
