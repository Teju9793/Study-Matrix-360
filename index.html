<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Study Matrix 360</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-X4DGJNQ1DB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap');

:root {
  --bg: #030d12;
  --t1: #00e5c0;
  --t2: #00b89c;
  --t3: #00ffd5;
  --t4: #0ec4b0;
  --muted: #4a7a72;
  --text: #d0fff5;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Sora', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── DEEP OCEAN BACKGROUND ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 90% 50% at 50% -5%,  rgba(0,200,160,0.13) 0%, transparent 60%),
    radial-gradient(ellipse 60% 60% at 100% 40%,  rgba(0,160,130,0.08) 0%, transparent 55%),
    radial-gradient(ellipse 50% 50% at 0%   70%,  rgba(0,180,150,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 70% 40% at 50% 110%,  rgba(0,100,80,0.15)  0%, transparent 60%);
  animation: oceanBreath 10s ease-in-out infinite alternate;
}
@keyframes oceanBreath {
  0%   { opacity: 0.7; transform: scaleY(1); }
  100% { opacity: 1;   transform: scaleY(1.04); }
}

/* ── BIOLUMINESCENT PARTICLES ── */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(1.5px 1.5px at 15% 25%, rgba(0,229,192,0.7), transparent),
    radial-gradient(1px   1px   at 75% 12%, rgba(0,200,160,0.5), transparent),
    radial-gradient(2px   2px   at 45% 65%, rgba(0,255,213,0.4), transparent),
    radial-gradient(1px   1px   at 88% 72%, rgba(0,180,145,0.5), transparent),
    radial-gradient(1.5px 1.5px at 30% 85%, rgba(0,229,192,0.5), transparent),
    radial-gradient(1px   1px   at 62% 38%, rgba(0,210,170,0.4), transparent),
    radial-gradient(2px   2px   at 8%  55%, rgba(0,255,213,0.35),transparent),
    radial-gradient(1px   1px   at 93% 90%, rgba(0,200,160,0.4), transparent);
  animation: drift 18s ease-in-out infinite alternate;
}
@keyframes drift {
  0%   { transform: translateY(0) translateX(0); }
  100% { transform: translateY(-20px) translateX(6px); }
}

/* ── BOTTOM WAVE LINE ── */
.wave-line {
  position: fixed; bottom: 0; left: 0; right: 0; height: 3px; z-index: 1;
  background: linear-gradient(90deg, transparent, var(--t1), var(--t3), var(--t2), transparent);
  background-size: 200% 100%;
  animation: waveFlow 4s linear infinite;
  pointer-events: none;
}
@keyframes waveFlow { 0%{background-position:0%} 100%{background-position:200%} }

/* ── SPLASH SCREEN ── */
#splash {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; text-align: center;
  z-index: 10; overflow: hidden;
}

/* Ripple rings */
#splash::before {
  content: '';
  position: absolute;
  width: 320px; height: 320px; border-radius: 50%;
  border: 1px solid rgba(0,229,192,0.15);
  animation: ripple 3s ease-out infinite;
}
#splash::after {
  content: '';
  position: absolute;
  width: 210px; height: 210px; border-radius: 50%;
  border: 1px solid rgba(0,229,192,0.22);
  animation: ripple 3s ease-out infinite 0.8s;
}
@keyframes ripple {
  0%   { transform: scale(0.8); opacity: 0.8; }
  100% { transform: scale(1.35); opacity: 0; }
}

/* ── LOGO BOX ── */
.logoBox {
  width: 148px; height: 148px;
  border-radius: 36px;
  background: linear-gradient(145deg, rgba(0,80,65,0.5), rgba(0,40,35,0.7));
  border: 1.5px solid rgba(0,229,192,0.25);
  box-shadow:
    0 0 0 6px rgba(0,229,192,0.05),
    0 0 40px rgba(0,200,160,0.2),
    0 24px 60px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(0,255,213,0.08);
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1;
  animation: floatLogo 4s ease-in-out infinite;
}
@keyframes floatLogo {
  0%,100% { transform: translateY(0) rotate(-1deg); }
  50%      { transform: translateY(-12px) rotate(1deg); }
}
.logoBox::before {
  content: '';
  position: absolute; inset: -2px; border-radius: 38px;
  background: linear-gradient(135deg, var(--t1), var(--t2), var(--t4), var(--t3));
  background-size: 300% 300%;
  animation: gradShift 5s ease infinite;
  z-index: -1; filter: blur(10px); opacity: 0.45;
}
@keyframes gradShift {
  0%,100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}
.logoBox img {
  width: 108px; height: 108px; border-radius: 22px;
  box-shadow: 0 0 24px rgba(0,229,192,0.35);
}

/* ── TEXT ── */
.splash-title {
  font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
  color: var(--text); z-index: 1; position: relative;
  line-height: 1.1;
}
.splash-title em {
  font-style: normal;
  background: linear-gradient(90deg, var(--t1), var(--t3));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.splash-sub {
  color: var(--muted); font-size: 13px;
  z-index: 1; position: relative; letter-spacing: 0.3px;
}

/* ── LOADING BAR ── */
.splash-bar {
  width: 140px; height: 2px; border-radius: 2px;
  background: rgba(0,229,192,0.1); overflow: hidden;
  z-index: 1; position: relative;
}
.splash-bar-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--t2), var(--t1), var(--t3));
  border-radius: 2px; box-shadow: 0 0 10px var(--t1);
  animation: loadBar 1.8s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes loadBar { to { width: 100%; } }

/* ── FADE OUT ── */
#splash.fade-out {
  opacity: 0;
  transition: opacity 0.45s ease;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="wave-line"></div>

<div id="splash">
  <div class="logoBox">
    <img src="ilogo.png" alt="Study Matrix Logo">
  </div>
  <div class="splash-title">Study <em>Matrix</em></div>
  <div class="splash-sub">Smart • Fast • Ocean Study Companion</div>
  <div class="splash-bar"><div class="splash-bar-fill"></div></div>
</div>

<script>
  /* ── SPLASH → DASHBOARD ── */
  // If already shown once this session, skip straight to dashboard
  if (sessionStorage.getItem('smSplashDone')) {
    window.location.replace('dashboard.html');
  } else {
    // Show splash for 1.9s then navigate
    setTimeout(function() {
      document.getElementById('splash').classList.add('fade-out');
      setTimeout(function() {
        sessionStorage.setItem('smSplashDone', '1');
        window.location.replace('dashboard.html');
      }, 450);
    }, 1900);
  }
</script>

</body>
</html>
