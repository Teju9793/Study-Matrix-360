<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PYQP — Study Matrix</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap');
:root{--status-bar-height:max(24px, env(safe-area-inset-top));--bg:#030d12;--card:#0a2030;--border:rgba(0,200,160,0.1);--t1:#00e5c0;--t2:#00b89c;--t3:#00ffd5;--muted:#4a7a72;--text:#d0fff5;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 90% 50% at 50% -5%,rgba(0,200,160,0.13) 0%,transparent 60%),radial-gradient(ellipse 60% 60% at 100% 40%,rgba(0,160,130,0.08) 0%,transparent 55%);animation:oceanBreath 10s ease-in-out infinite alternate;}
@keyframes oceanBreath{0%{opacity:.7;transform:scaleY(1)}100%{opacity:1;transform:scaleY(1.04)}}
.topbar{position:fixed;top:0;left:0;right:0;height:calc(62px + var(--status-bar-height));padding-top:var(--status-bar-height);padding-left:18px;padding-right:18px;display:flex;align-items:center;justify-content:space-between;background:rgba(3,13,18,0.92);backdrop-filter:blur(28px) saturate(200%);-webkit-backdrop-filter:blur(28px);border-bottom:1px solid rgba(0,200,160,0.08);z-index:9999;}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--t1),var(--t3),var(--t2),transparent);background-size:200% 100%;animation:waveFlow 4s linear infinite;box-shadow:0 0 8px rgba(0,229,192,0.3);}
@keyframes waveFlow{0%{background-position:0% 0%}100%{background-position:200% 0%}}
.tb-title{font-size:20px;font-weight:800;letter-spacing:-0.3px;background:linear-gradient(90deg,var(--t1),var(--t3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.tb-back{padding:7px 16px;font-size:13px;font-weight:600;background:rgba(0,80,65,0.25);border:1px solid rgba(0,200,160,0.2);color:var(--t1);border-radius:12px;cursor:pointer;transition:all .2s;font-family:'Sora',sans-serif;}
.tb-back:hover{background:rgba(0,100,80,0.35);border-color:var(--t1);box-shadow:0 0 14px rgba(0,229,192,0.18);}
.main{position:relative;z-index:1;padding-top:calc(72px + var(--status-bar-height));padding-bottom:40px;}
.page-header{text-align:center;padding:0 16px 6px;}
.page-title{font-size:24px;font-weight:800;background:linear-gradient(90deg,var(--t1),var(--t3),var(--t2));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite;filter:drop-shadow(0 0 12px rgba(0,200,160,0.3));}
@keyframes shimmer{to{background-position:200% center}}
.page-sub{font-size:13px;color:var(--muted);margin-top:4px;}
.list{padding:16px 14px 40px;max-width:580px;margin:0 auto;}
.item{display:flex;align-items:center;gap:14px;padding:15px 16px;margin-bottom:10px;border-radius:20px;cursor:pointer;background:linear-gradient(145deg,rgba(10,32,48,0.9),rgba(7,24,36,0.95));border:1px solid rgba(0,180,145,0.12);box-shadow:0 4px 24px rgba(0,0,0,0.5),inset 0 1px 0 rgba(0,255,213,0.04);backdrop-filter:blur(16px);transition:all .3s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden;}
.item:nth-child(1){--ck:#00e5c0}.item:nth-child(2){--ck:#00b89c}.item:nth-child(3){--ck:#26d9c0}.item:nth-child(4){--ck:#00ffd5}.item:nth-child(5){--ck:#0ec4b0}.item:nth-child(6){--ck:#00d4b0}.item:nth-child(7){--ck:#00c9a7}
.item::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ck,var(--t1));box-shadow:0 0 12px var(--ck,var(--t1));opacity:.7;transition:opacity .3s;}
.item:hover{transform:translateY(-3px) translateX(3px);border-color:rgba(0,200,160,0.25);box-shadow:0 14px 40px rgba(0,0,0,0.6);}
.item:hover::before{opacity:1;}
.item-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--ck,var(--t1)) 18%,transparent),color-mix(in srgb,var(--ck,var(--t1)) 6%,transparent));border:1px solid color-mix(in srgb,var(--ck,var(--t1)) 22%,transparent);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.item-text{font-size:15px;font-weight:700;color:var(--text);}
.item-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(4px);}
.popup-box{background:linear-gradient(145deg,rgba(4,16,24,0.98),rgba(3,12,20,0.98));border:1px solid rgba(0,200,160,0.14);border-radius:24px;padding:28px 24px;width:85%;max-width:320px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.9);}
.popup-box h2{font-size:18px;font-weight:800;color:var(--t1);margin-bottom:10px;}
.popup-box p{color:var(--muted);font-size:14px;margin-bottom:20px;}
.popup-btn{padding:10px 28px;border:none;border-radius:20px;background:linear-gradient(135deg,var(--t1),var(--t3));color:#032b2e;font-weight:700;font-family:'Sora',sans-serif;cursor:pointer;}
</style>
</head>
<body>
<div class="topbar"><div class="tb-title">Study Matrix</div><button class="tb-back" id="backBtnEl" onclick="goHome()">‹ Back</button></div>
<div class="main">
  <div class="page-header"><div class="page-title" id="pageTitle">PYQP</div><div class="page-sub" id="pageSub">Previous Year Question Papers</div></div>
  <div class="list" id="viewHome">
    <div class="item" onclick="openYear()"><div class="item-icon">📁</div><div><div class="item-text">1st Year</div><div class="item-sub">Physics & Chemistry Cycle</div></div></div>
    <div class="item" onclick="comingSoon('CSE')"><div class="item-icon">📁</div><div><div class="item-text">CSE</div><div class="item-sub">Coming Soon</div></div></div>
    <div class="item" onclick="comingSoon('ISE')"><div class="item-icon">📁</div><div><div class="item-text">ISE</div><div class="item-sub">Coming Soon</div></div></div>
    <div class="item" onclick="comingSoon('DSE')"><div class="item-icon">📁</div><div><div class="item-text">DSE</div><div class="item-sub">Coming Soon</div></div></div>
  </div>
  <div class="list" id="viewCycle" style="display:none">
    <div class="item" onclick="openPCycle()"><div class="item-icon">📘</div><div><div class="item-text">Physics Cycle</div></div></div>
    <div class="item" onclick="openCCycle()"><div class="item-icon">📗</div><div><div class="item-text">Chemistry Cycle</div></div></div>
  </div>
  <div class="list" id="viewSubjects" style="display:none"></div>
</div>
<div class="popup-overlay" id="popup" style="display:none"><div class="popup-box"><h2 id="popupTitle">Coming Soon</h2><p>This section will be available soon.</p><button class="popup-btn" onclick="closePopup()">OK</button></div></div>
<script>
let currentView="home";
function goHome(){if(currentView==="subjects"){currentView="cycle";switchView("1st Year – Select Cycle","","viewCycle");}else if(currentView==="cycle"){currentView="home";switchView("PYQP","Previous Year Question Papers","viewHome");}else{window.history.back();}}
function openYear(){currentView="cycle";switchView("1st Year – Select Cycle","","viewCycle");}
function openPCycle(){currentView="subjects";showSubjects("Physics Cycle",[["Calculus & Linear Algebra","https://drive.google.com/drive/folders/1j2r0OSKm0rjFpsc388b3pEKhY4G2LZ7z"],["Advanced Calculus & Numerical Methods","https://drive.google.com/drive/folders/1aff6Ie-y2c7aHOGUkVNnRSSmZtGPiG7v"],["Engineering Physics","https://drive.google.com/drive/folders/1rXkEmHxIuTzVv8TJgKdYdVOb_-teSqKE"],["Basic Electronics Engineering","https://drive.google.com/drive/folders/1eq2OWEzh_gyYy11NQ0a_7orAMroDDvx4"],["Programming with C","https://drive.google.com/drive/folders/1fRfV30H5bsjIfl2-Qg4ofPfeZCnaUSjy"],["Programming with Python","https://drive.google.com/drive/folders/1VMyyyutRs67561WkXfxoISvzRBtcSNQg"],["Basic Civil Engineering","https://drive.google.com/drive/folders/19qat7gaVxSfKliaKPmMiT-bjJBC0ZBTw"]]);}
function openCCycle(){currentView="subjects";showSubjects("Chemistry Cycle",[["Calculus & Linear Algebra","https://drive.google.com/drive/folders/1j2r0OSKm0rjFpsc388b3pEKhY4G2LZ7z"],["Advanced Calculus & Numerical Methods","https://drive.google.com/drive/folders/1aff6Ie-y2c7aHOGUkVNnRSSmZtGPiG7v"],["Engineering Chemistry","https://drive.google.com/drive/folders/1e73IADpJtmbUl0-_Tah7ZJr1OM0t4_Te"],["Basic Electrical Engineering","https://drive.google.com/drive/folders/1w5jkbYe-3MV-HW97hU0gyQm4wpHRTzm8"],["Programming with Python","https://drive.google.com/drive/folders/1VMyyyutRs67561WkXfxoISvzRBtcSNQg"],["Programming with C","https://drive.google.com/drive/folders/1fRfV30H5bsjIfl2-Qg4ofPfeZCnaUSjy"],["Basic Mechanical Engineering","https://drive.google.com/drive/folders/18LCqUSAspKuVCOLFBn_OrIEKW5oksYBG"]]);}
function showSubjects(title,list){document.getElementById("viewHome").style.display="none";document.getElementById("viewCycle").style.display="none";const box=document.getElementById("viewSubjects");box.innerHTML="";list.forEach((s,i)=>{box.innerHTML+=`<div class="item" style="--ck:var(--t${(i%3)+1})" onclick="window.open('${s[1]}','_blank','noopener')"><div class="item-icon">📄</div><div class="item-text">${s[0]}</div></div>`;});document.getElementById("pageTitle").innerText=title;document.getElementById("pageSub").innerText="Select Subject";box.style.display="block";}
function switchView(title,sub,showId){document.getElementById("pageTitle").innerText=title;document.getElementById("pageSub").innerText=sub;["viewHome","viewCycle","viewSubjects"].forEach(id=>document.getElementById(id).style.display="none");document.getElementById(showId).style.display="block";}
function comingSoon(name){document.getElementById("popupTitle").innerText=name+" – Coming Soon";document.getElementById("popup").style.display="flex";}
function closePopup(){document.getElementById("popup").style.display="none";}
(function(){function setBar(px){if(px>0&&px<120)document.documentElement.style.setProperty('--status-bar-height',px+'px');}function detect(){if(window.screenTop>0&&window.screenTop<120){setBar(window.screenTop);return;}if(window.screenY>0&&window.screenY<120){setBar(window.screenY);return;}var d=window.screen.height-window.outerHeight;if(d>0&&d<80)setBar(d);}detect();window.addEventListener('load',detect);window.addEventListener('resize',detect);setTimeout(detect,500);setTimeout(detect,1500);})();
</script>
<script>
(function(){function smPush(){history.pushState({sm:true},'');}smPush();window.addEventListener('popstate',function(){if(currentView==='subjects'){currentView='cycle';switchView('1st Year – Select Cycle','','viewCycle');smPush();}else if(currentView==='cycle'){currentView='home';switchView('PYQP','Previous Year Question Papers','viewHome');smPush();}else{window.location.replace('dashboard.html');}});})();
</script>
</body></html>
