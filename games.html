<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<title>Games – Study Matrix 360</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-X4DGJNQ1DB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-X4DGJNQ1DB');

<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap');
:root{--status-bar-height:max(0px, env(safe-area-inset-top));--bg:#030d12;--card:#0a2030;--border:rgba(0,200,160,0.1);--t1:#00e5c0;--t2:#00b89c;--t3:#00ffd5;--t4:#0ec4b0;--muted:#4a7a72;--text:#d0fff5;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{width:100%;height:100%;}
body{width:100%;min-height:100vh;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 90% 50% at 50% -5%,rgba(0,200,160,0.13) 0%,transparent 60%),radial-gradient(ellipse 60% 60% at 100% 40%,rgba(0,160,130,0.08) 0%,transparent 55%),radial-gradient(ellipse 50% 50% at 0% 70%,rgba(0,180,150,0.07) 0%,transparent 55%),radial-gradient(ellipse 70% 40% at 50% 110%,rgba(0,100,80,0.15) 0%,transparent 60%);animation:oceanBreath 10s ease-in-out infinite alternate;}
@keyframes oceanBreath{0%{opacity:.7;transform:scaleY(1)}100%{opacity:1;transform:scaleY(1.04)}}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 15% 25%,rgba(0,229,192,0.7),transparent),radial-gradient(1px 1px at 75% 12%,rgba(0,200,160,0.5),transparent),radial-gradient(2px 2px at 45% 65%,rgba(0,255,213,0.4),transparent),radial-gradient(1px 1px at 88% 72%,rgba(0,180,145,0.5),transparent),radial-gradient(1.5px 1.5px at 30% 85%,rgba(0,229,192,0.5),transparent),radial-gradient(1px 1px at 62% 38%,rgba(0,210,170,0.4),transparent),radial-gradient(2px 2px at 8% 55%,rgba(0,255,213,0.35),transparent),radial-gradient(1px 1px at 93% 90%,rgba(0,200,160,0.4),transparent);animation:drift 18s ease-in-out infinite alternate;}
@keyframes drift{0%{transform:translateY(0) translateX(0)}100%{transform:translateY(-20px) translateX(6px)}}
.app::after{content:'';position:fixed;bottom:0;left:0;right:0;height:3px;z-index:0;background:linear-gradient(90deg,transparent,var(--t1),var(--t3),var(--t2),transparent);background-size:200% 100%;animation:waveFlow 4s linear infinite;pointer-events:none;}
@keyframes waveFlow{0%{background-position:0% 0%}100%{background-position:200% 0%}}
.app{min-height:100vh;overflow-x:hidden;overflow-y:auto;position:relative;z-index:1;}
.topbar{position:fixed;top:0;left:0;right:0;height:calc(62px + max(0px, env(safe-area-inset-top)));padding-top:max(0px, env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;padding-left:18px;padding-right:18px;background:rgba(3,13,18,0.88);backdrop-filter:blur(28px) saturate(200%);-webkit-backdrop-filter:blur(28px);border-bottom:1px solid rgba(0,200,160,0.08);z-index:9999;}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--t1),var(--t3),var(--t2),transparent);background-size:200% 100%;animation:waveFlow 4s linear infinite;box-shadow:0 0 8px rgba(0,229,192,0.3);}
.title{font-size:22px;font-weight:800;letter-spacing:-0.3px;white-space:nowrap;color:#00eaff;text-shadow:0 0 12px #00eaff;}
.title em{font-style:normal;background:linear-gradient(90deg,var(--t1),var(--t3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.backBtn{padding:7px 16px;font-size:13px;font-weight:600;background:rgba(0,80,65,0.25);border:1px solid rgba(0,200,160,0.2);color:var(--t1);border-radius:12px;cursor:pointer;transition:all .2s;font-family:'Sora',sans-serif;}
.backBtn:hover{background:rgba(0,100,80,0.35);border-color:var(--t1);box-shadow:0 0 14px rgba(0,229,192,0.18);}
.main{padding-top:calc(72px + max(0px, env(safe-area-inset-top)));padding-bottom:40px;min-height:calc(100vh - 72px);overflow-y:auto;display:flex;flex-direction:column;align-items:center;}
.gameGrid{width:100%;max-width:580px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px 16px;}
.gameTile{background:linear-gradient(145deg,rgba(10,32,48,0.9),rgba(7,24,36,0.95));border:1px solid rgba(0,180,145,0.1);border-radius:20px;padding:22px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,0.5),inset 0 1px 0 rgba(0,255,213,0.03);backdrop-filter:blur(14px);transition:all .28s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden;}
.gameTile:nth-child(1){--gt:#00e5c0}.gameTile:nth-child(2){--gt:#00b89c}.gameTile:nth-child(3){--gt:#26d9c0}.gameTile:nth-child(4){--gt:#00ffd5}.gameTile:nth-child(5){--gt:#0ec4b0}
.gameTile::before{content:'';position:absolute;top:0;left:10%;right:10%;height:2px;background:var(--gt,var(--t1));border-radius:0 0 4px 4px;box-shadow:0 0 12px var(--gt,var(--t1));opacity:0;transition:opacity .28s;}
.gameTile::after{content:'';position:absolute;inset:0;border-radius:20px;background:radial-gradient(ellipse 80% 60% at 50% 0%,color-mix(in srgb,var(--gt,var(--t1)) 12%,transparent),transparent 70%);}
.gameTile:hover{transform:translateY(-9px) scale(1.04);border-color:color-mix(in srgb,var(--gt,var(--t1)) 40%,transparent);box-shadow:0 18px 44px rgba(0,0,0,0.65),0 0 30px color-mix(in srgb,var(--gt,var(--t1)) 20%,transparent);}
.gameTile:hover::before{opacity:1;}
.gameTile img{width:56px;height:56px;position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));transition:all .28s;}
.gameTile:hover img{transform:scale(1.15) translateY(-4px);filter:drop-shadow(0 8px 16px color-mix(in srgb,var(--gt,var(--t1)) 60%,transparent));}
.gameTile span{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0.4px;text-align:center;position:relative;z-index:1;transition:color .2s;}
.gameTile:hover span{color:var(--text);}
.gamesTitle{font-size:22px;font-weight:800;letter-spacing:-0.3px;background:linear-gradient(90deg,var(--t1),var(--t3),var(--t2));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s linear infinite;margin:18px 0 2px;filter:drop-shadow(0 0 14px rgba(0,200,160,0.3));text-align:center;}
@keyframes shimmer{to{background-position:200% center}}
@media(max-width:599px){.title{font-size:18px;}.gameGrid{grid-template-columns:repeat(2,1fr);gap:10px;}}
</style>
</head>
<body>
<div class="app" id="appShell">
  <div class="topbar">
    <div class="title">Study <em>Matrix</em></div>
    <button class="backBtn" onclick="handleBack()">‹ Back</button>
  </div>
  <main class="main">
    <div class="gamesTitle">🎮 Games</div>
    <div class="gameGrid">
      <div class="gameTile" onclick="openGame('games/Xox.html')"><img src="icons/xox.png" alt="XOX"><span>XOX</span></div>
      <div class="gameTile" onclick="openGame('games/snake.html')"><img src="icons/snake.png" alt="Snake"><span>Snake</span></div>
      <div class="gameTile" onclick="openGame('games/memory.html')"><img src="icons/memory.png" alt="Memory Match"><span>Memory Match</span></div>
      <div class="gameTile" onclick="openGame('games/puzzle.html')"><img src="icons/puzzle.png" alt="Puzzle Zone"><span>Puzzle Zone</span></div>
      <div class="gameTile" onclick="openGame('games/doodle.html')"><img src="icons/doodle.png" alt="Doodle Pad"><span>Doodle Pad</span></div>
    </div>
  </main>
</div>
<script>
  history.pushState({ smPage: 'games' }, '');
  window.addEventListener('popstate', function() { window.location.replace('dashboard.html'); });
  function handleBack() { window.location.href = 'dashboard.html'; }
  function openGame(url) { localStorage.setItem('smReturnView', 'games'); window.location.href = url; }
  (function() {
    function fix() {
      var t = document.querySelector('.topbar'), m = document.querySelector('.main');
      if (t) { t.style.position='fixed';t.style.top='0'; }
      if (m) { m.style.paddingTop='calc(72px + max(0px, env(safe-area-inset-top)))'; }
      document.body.style.paddingTop='0';
      document.documentElement.style.paddingTop='0';
    }
    fix();
    window.addEventListener('resize', fix);
    window.addEventListener('orientationchange', function(){ setTimeout(fix,100); });
  })();
</script>
</body>
</html>
